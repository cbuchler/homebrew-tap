name: Native bottles
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bottles-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -euo pipefail {0}
jobs:
  bottle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_FROM_API: 1
    steps:
      - uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29
      - name: Select the reviewed source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tap=$(brew --repository cbuchler/tap)
          git -C "$tap" fetch origin "$EXPECTED_HEAD"
          git -C "$tap" checkout --detach "$EXPECTED_HEAD"
          test "$(git -C "$tap" rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf '# Homebrew validation\n\nProtected rendering works.\n' > "$RUNNER_TEMP/document.md"
      - name: Install Linux host requirements
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap gcc
      - name: Check Linux executable requirements
        if: runner.os == 'Linux'
        run: brew ruby test/requirement.rb "$(brew --repository cbuchler/tap)/Formula/mdview.rb"
      - name: Audit the release formula
        run: brew audit --skip-style cbuchler/tap/mdview
      - name: Build and test source installation
        run: |
          brew install --build-bottle cbuchler/tap/mdview
          mdview --no-history "$RUNNER_TEMP/document.md" > "$RUNNER_TEMP/source.txt"
          grep -q 'Protected rendering works' "$RUNNER_TEMP/source.txt"
          brew test --verbose cbuchler/tap/mdview
      - name: Build bottles and verify installation
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bottles"
          cd "$GITHUB_WORKSPACE/bottles"
          version=$(mdview --version)
          brew bottle --json --no-rebuild --root-url="https://github.com/cbuchler/homebrew-tap/releases/download/mdview-$version" cbuchler/tap/mdview
          brew uninstall cbuchler/tap/mdview
          brew install ./*.bottle.tar.gz
          brew info --json=v2 cbuchler/tap/mdview > "$RUNNER_TEMP/receipt.json"
          jq -e '.formulae[0].installed[0].poured_from_bottle == true' "$RUNNER_TEMP/receipt.json"
          brew test --verbose cbuchler/tap/mdview
          binary="$(brew --prefix)/bin/mdview"
          tools=$(mktemp -d)
          trap 'rm -rf "$tools"' EXIT
          if [ "$RUNNER_OS" = Linux ]; then
            for tool in bwrap systemd-run; do ln -s "$(command -v "$tool")" "$tools/$tool"; done
          else
            for tool in bash env; do ln -s "$(command -v "$tool")" "$tools/$tool"; done
          fi
          PATH="$tools" "$binary" --no-history "$RUNNER_TEMP/document.md" > "$RUNNER_TEMP/bottle.txt"
          grep -q 'Protected rendering works' "$RUNNER_TEMP/bottle.txt"
          if [ "$RUNNER_OS" = Linux ]; then
            if XDG_RUNTIME_DIR="$tools/no-session" DBUS_SESSION_BUS_ADDRESS="unix:path=$tools/no-bus" \
              PATH="$tools" "$binary" --no-history "$RUNNER_TEMP/document.md" > "$RUNNER_TEMP/refused.txt" 2> "$RUNNER_TEMP/refused.err"; then
              echo 'Rendering unexpectedly succeeded without a systemd user session' >&2
              exit 1
            fi
            test ! -s "$RUNNER_TEMP/refused.txt"
          fi
          test -f "$(brew --prefix)/share/zsh/site-functions/_mdview"
          test -f "$(brew --prefix)/share/fish/vendor_completions.d/mdview.fish"
          test -f "$(brew --prefix)/etc/bash_completion.d/mdview"
          brew uninstall cbuchler/tap/mdview
          test -z "$(brew list --versions mdview)"
      - uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: bottles/*.bottle.*
          if-no-files-found: error
      - name: Show build logs
        if: failure()
        run: |
          for directory in "$HOME/Library/Logs/Homebrew/mdview" "$HOME/.cache/Homebrew/Logs/mdview"; do
            if [ -d "$directory" ]; then tail -n 80 "$directory"/*; fi
          done
